version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: vita-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - vita-net

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    container_name: vita-backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-vitaform_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PAYWALL_PRICE_EUR: ${PAYWALL_PRICE_EUR:-14.90}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      SENDER_EMAIL: ${SENDER_EMAIL:-noreply@vitae-publica.tech}
      APP_NAME: vitaform
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
    depends_on:
      - mongo
    networks:
      - vita-net

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
      args:
        REACT_APP_BACKEND_URL: ${PUBLIC_APP_URL}
    container_name: vita-frontend
    restart: unless-stopped
    networks:
      - vita-net

  nginx:
    image: nginx:1.27-alpine
    container_name: vita-nginx
    restart: unless-stopped
    ports:
      - "8005:80"
    volumes:
      - ./nginx-container.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - vita-net

volumes:
  mongo_data:

networks:
  vita-net:
