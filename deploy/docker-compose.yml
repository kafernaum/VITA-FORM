name: vita-form

services:
  mongo:
    image: mongo:7
    container_name: vita-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      - mongo_backup:/backup
    networks: [vita-net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: vita-form/backend:latest
    container_name: vita-backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-vitaform_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PAYWALL_PRICE_EUR: ${PAYWALL_PRICE_EUR:-14.90}
      PAYPAL_ENV: ${PAYPAL_ENV:-live}
      PAYPAL_BUSINESS_EMAIL: ${PAYPAL_BUSINESS_EMAIL}
      PAYPAL_MERCHANT_ID: ${PAYPAL_MERCHANT_ID}
      RESEND_API_KEY: ${RESEND_API_KEY}
      SENDER_EMAIL: ${SENDER_EMAIL:-onboarding@resend.dev}
      APP_NAME: ${APP_NAME:-vitaform}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
    depends_on:
      mongo:
        condition: service_healthy
    networks: [vita-net]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/api/').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        REACT_APP_BACKEND_URL: ${PUBLIC_APP_URL}
    image: vita-form/frontend:latest
    container_name: vita-frontend
    restart: unless-stopped
    networks: [vita-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: vita-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8005:80"
    volumes:
      - ./nginx-container.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks: [vita-net]

volumes:
  mongo_data:
  mongo_backup:

networks:
  vita-net:
