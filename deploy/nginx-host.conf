# Nginx hôte → reverse-proxy SSL vers le conteneur Nginx (port 8005)
# À placer dans /etc/nginx/sites-available/vita-form puis lien dans sites-enabled.
# Certbot ajoutera automatiquement les blocs SSL après `certbot --nginx -d formation.vitae-publica.tech`.

server {
    listen 80;
    server_name formation.vitae-publica.tech;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
